<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body class="demo">
    <main>
      <!--family:header-->
      <section class="stage-row" aria-label="The builder">
        <div class="stage-box">
          <div class="view-space">
            <uchusen-rocket id="rocket" data-testid="rocket" rocket="starship" variant="v3" show="together" look="painted" view="three-quarter" spin="off"></uchusen-rocket>
          </div>
          <p class="hint" id="builder-label" data-testid="builder-label"></p>
        </div>
        <div class="panel">
          <div class="field">
            <h2 id="maker-title">Maker</h2>
            <div class="chips" id="makers" role="group" aria-labelledby="maker-title"></div>
          </div>
          <div class="field">
            <h2 id="rocket-title">Rocket</h2>
            <div class="chips" id="rockets" role="group" aria-labelledby="rocket-title"></div>
          </div>
          <div class="field">
            <h2 id="variant-title">Variant</h2>
            <div class="chips" id="variants" role="group" aria-labelledby="variant-title"></div>
          </div>
          <div class="field">
            <h2 id="show-title">Parts</h2>
            <div class="chips" id="shows" role="group" aria-labelledby="show-title"></div>
          </div>
          <div class="field">
            <h2 id="look-title">Look</h2>
            <div class="chips" id="looks" role="group" aria-labelledby="look-title"></div>
          </div>
          <div class="field">
            <h2 id="view-title">View</h2>
            <div class="chips" id="views" role="group" aria-labelledby="view-title"></div>
          </div>
          <div class="field">
            <h2 id="engines-title">Engines</h2>
            <div class="chips" id="engines" role="group" aria-labelledby="engines-title"></div>
          </div>
        </div>
      </section>
      <section aria-label="The code">
        <h2>The code</h2>
        <kazoku-embed-panel id="embed-panel" data-testid="embed-panel" aspect="1.3333" docs-href="docs/" theme="dark"></kazoku-embed-panel>
      </section>
      <!--family:unreviewed-->
      <!--family:footer-->
    </main>
    <!--family:scripts js/embed-page.js-->
  </body>
</html>
