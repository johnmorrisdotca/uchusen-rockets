<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: data:; base-uri 'none'; form-action 'none'" />
    <title>Uchusen Rockets code builder</title>
    <meta name="description" content="Choose a rocket, its look, its view and its parts, and copy the code that puts exactly that on your own page." />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <header class="top">
      <h1>Rocket code builder <span class="jp" lang="ja">宇宙船</span></h1>
      <p class="lede">Choose a rocket, how it looks and which parts show. Copy the code that puts exactly that on your own page. <a href="./">The full demo</a> · <a href="docs/">The documentation</a></p>
    </header>
    <main>
      <section class="stage-row" aria-label="The builder">
        <div class="stage-box">
          <div class="view-space">
            <uchusen-rocket id="rocket" data-testid="rocket" rocket="starship" variant="v3" show="together" look="line" view="three-quarter" spin="off"></uchusen-rocket>
          </div>
          <p class="hint" id="builder-label" data-testid="builder-label"></p>
        </div>
        <div class="panel">
          <div class="field">
            <h2 id="maker-title">Maker</h2>
            <div class="chips" id="makers" role="group" aria-labelledby="maker-title"></div>
          </div>
          <div class="field">
            <h2 id="rocket-title">Rocket</h2>
            <div class="chips" id="rockets" role="group" aria-labelledby="rocket-title"></div>
          </div>
          <div class="field">
            <h2 id="variant-title">Variant</h2>
            <div class="chips" id="variants" role="group" aria-labelledby="variant-title"></div>
          </div>
          <div class="field">
            <h2 id="show-title">The parts</h2>
            <div class="chips" id="shows" role="group" aria-labelledby="show-title"></div>
          </div>
          <div class="field-pair">
            <div class="field">
              <h2 id="look-title">Look</h2>
              <div class="chips" id="looks" role="group" aria-labelledby="look-title"></div>
            </div>
            <div class="field">
              <h2 id="view-title">From</h2>
              <div class="chips" id="views" role="group" aria-labelledby="view-title"></div>
            </div>
            <div class="field">
              <h2 id="engines-title">Engines</h2>
              <div class="chips" id="engines" role="group" aria-labelledby="engines-title"></div>
            </div>
          </div>
        </div>
      </section>
      <section aria-label="The code">
        <h2>The code</h2>
        <div class="chips" id="kinds" role="tablist" aria-label="Which way to put it on a page"></div>
        <p id="embed-note" data-testid="builder-note"></p>
        <pre class="code"><code id="code" data-testid="builder-code"></code></pre>
        <div class="embed-actions">
          <button type="button" class="chip" id="copy" data-testid="builder-copy">Copy the code</button>
          <a class="chip" id="open" data-testid="builder-open" href="embed.html">Open the embed page</a>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
        <p id="credit" data-testid="builder-credit" hidden></p>
      </section>
    </main>
    <script type="module" src="js/builder.js"></script>
  </body>
</html>
