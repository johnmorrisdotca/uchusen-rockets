<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="beam.css" />
  </head>
  <body class="demo beam">
    <main>
      <!--family:header--><!--frame:header-->
      <section class="beam-page" aria-label="Tractor beam" data-say-label="beamTitle">
        <h1 data-say="beamTitle">Tractor beam</h1>
        <p data-say="beamIntro">A soft cone from the drone to the part. Reduced motion draws a dotted line.</p>
        <div class="chips" id="beam-controls" role="group" aria-label="Motion" data-say-label="pauseGroup"></div>
        <div class="beam-stage" id="beam-stage" data-testid="beam-stage">
        <div class="beam-row" id="beam-row">
          <figure>
            <div id="beam-carry" data-testid="beam-carry"></div>
            <figcaption data-say="beamCarry">Carrying</figcaption>
          </figure>
          <figure>
            <div id="beam-line" data-testid="beam-line"></div>
            <figcaption data-say="look_line">Line</figcaption>
          </figure>
          <figure>
            <div id="beam-dotted" data-testid="beam-dotted"></div>
            <figcaption data-say="beamReduced">Reduced motion</figcaption>
          </figure>
        </div>
        </div>
      </section>
      <!--frame:credits-->
      <!--family:footer-->
    </main>
    <!--family:scripts js/beam.js-->
  </body>
</html>
