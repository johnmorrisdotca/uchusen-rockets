name: CI
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The demo's browser suite, split so every job ends in about half an hour (one job took 1.3 to 2.4 hours): the graphics-memory file in two shards, every other file at a desk's width, then a phone's width in Chromium, then in WebKit. Every test still runs once.
  demo:
    name: demo (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "graphics memory 1/2", set: freeze, project: chromium-desk, shard: "1/2", browser: chromium }
          - { name: "graphics memory 2/2", set: freeze, project: chromium-desk, shard: "2/2", browser: chromium }
          - { name: "desk, Chromium", set: rest, project: chromium-desk, shard: "1/1", browser: chromium }
          - { name: "phone, Chromium", set: all, project: chromium-phone, shard: "1/1", browser: chromium }
          - { name: "phone, WebKit", set: all, project: webkit-phone, shard: "1/1", browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A browser download or the system packages beside it hung for 25 minutes once: each try is cut off at 8 minutes, and tried up to three times.
      - name: The browser
        timeout-minutes: 26
        run: for try in 1 2 3; do timeout 8m pnpm exec playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "try $try failed"; done; exit 1
      - name: The site and the documentation site, as the demo's tests read them
        run: pnpm site && node scripts/docs-site.mjs build
      - name: The demo, played in ${{ matrix.name }}
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          DEMO_SET: ${{ matrix.set }}
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's, the docs' and the guides' examples, run against the built package
        run: pnpm test:readme
      - name: The documentation site's checks, every export documented and every example run
        run: pnpm docs:check
