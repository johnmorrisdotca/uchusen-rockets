name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_main_push:
        description: "Act as a push to main would: look for a green run of this workflow on the commit and skip the heavy jobs if there is one. For trying the lookup without touching main."
        type: boolean
        default: false
      lookup_sha:
        description: "With simulate_main_push: look for a green run on this commit instead (a dry run: the heavy jobs are skipped and the summary says what a push would do). Empty: this commit, and the heavy jobs follow the answer."
        type: string
        default: ""
# A dry run of the lookup (lookup_sha) is named so, and the lookup never counts it: it skips the heavy jobs and ends green, which is not a green run of the commit.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.lookup_sha != '' && 'CI (dry run of the skip lookup)' || '' }}
permissions:
  contents: read
  actions: read
jobs:
  already-green:
    # A release runs this workflow on the release branch (by hand), then the fast-forward to main runs it again on the identical commit. On a push to main, ask GitHub whether a run
    # of this workflow already succeeded on this commit; if one did, the heavy jobs are skipped and the run is green. A failed, cancelled, unfinished, skipped or dry run does not count (the run's own jobs are read), and
    # any other event (a pull request, a branch, a run by hand) always runs everything.
    name: A green run of this commit already exists?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.ask.outputs.skip }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate_main_push }}
          LOOKUP_SHA: ${{ inputs.lookup_sha }}
          WORKFLOW_FILE: ci.yml
        run: |
          ask="no"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then ask="yes"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SIMULATE" = true ]; then ask="yes"; echo "Simulating a push to main."; fi
          if [ "$ask" = no ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Not a push to main ($GITHUB_EVENT_NAME on $GITHUB_REF): everything runs."
            exit 0
          fi
          sha="$GITHUB_SHA"
          dry=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$LOOKUP_SHA" ]; then sha="$LOOKUP_SHA"; dry=true; fi
          # A run vouches for the commit only if its real jobs ran and passed: the `check` job succeeded (not skipped), a browser job (a demo or freeze job) succeeded, and no job failed or was cancelled.
          # A run that skipped its heavy jobs and ended green (a dry run, or a push that skipped) is never enough. Only the 5 newest completed runs of the commit are looked at, one jobs call for each; the first that qualifies ends the search.
          # Any failed question means everything runs.
          found=0
          if ! candidates="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$sha&status=completed&per_page=5" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.conclusion == \"success\") | .id")"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Could not read the runs of $WORKFLOW_FILE: everything runs."
            exit 0
          fi
          for id in $candidates; do
            if ok="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '([.jobs[] | select(.name | test("^check( |$)")) | select(.conclusion == "success")] | length >= 1) and ([.jobs[] | select(.name | test("^(demo|freeze)( |$)")) | select(.conclusion == "success")] | length >= 1) and ([.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")] | length == 0)')" && [ "$ok" = true ]; then
              found=1
              echo "Run $id ran its checks and browser jobs and passed."
              break
            fi
            echo "Run $id does not vouch for the commit (its real jobs did not all run and pass)."
          done
          echo "Runs of $WORKFLOW_FILE on $sha:"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[] | "  \(.event) \(.status) \(.conclusion) \(.html_url)"' || true
          skip=false
          if [ "$found" -ge 1 ]; then
            echo "A full green run of $WORKFLOW_FILE exists for $sha."
            skip=true
          else
            echo "No full green run of $WORKFLOW_FILE for $sha (a skipped or dry run does not count)."
          fi
          if [ "$dry" = true ]; then
            echo "A dry run (lookup_sha): a push to main with that commit would $([ "$skip" = true ] && echo 'skip the heavy jobs' || echo 'run everything'). The heavy jobs are skipped here whatever the answer."
            echo "A push to main with $sha would $([ "$skip" = true ] && echo 'skip the heavy jobs' || echo 'run everything')." >> "$GITHUB_STEP_SUMMARY"
            skip=true
          fi
          [ "$skip" = true ] && [ "$dry" = false ] && echo "The heavy jobs are skipped."
          [ "$skip" = false ] && echo "Everything runs."
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  check:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The package and the site are built once, and every demo job plays the tests against that copy (building took a minute and a half in each of 28 jobs). The tests read both dist (the package, as a CDN would serve it) and site.
  build:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The site and the documentation site, as the demo's tests read them
        run: pnpm site && node scripts/docs-site.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: |
            site
            dist
          retention-days: 1
  # The demo's browser suite, split so every job ends in minutes, not an hour (one job took 1.3 to 2.4 hours). scripts/ci-shard.mjs fills the jobs with the tests longest first, by their measured seconds (scripts/demo-times.json), so each job takes about the same; every test is played by one job. The fleet walk is one test, split by ship (FLEET_PART).
  demo:
    name: demo (${{ matrix.name }})
    needs: [already-green, build]
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # 25 minutes, as chikyu-earth and wakusei-planets allow (MODULES-766): the browser's install alone may take that long on a slow mirror, and a job cut off at 10 minutes had passed every test it reached.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "graphics memory, fleet walk 1 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "1/5" }
          - { name: "graphics memory, fleet walk 2 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "2/5" }
          - { name: "graphics memory, fleet walk 3 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "3/5" }
          - { name: "graphics memory, fleet walk 4 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "4/5" }
          - { name: "graphics memory, fleet walk 5 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "5/5" }
          - { name: "graphics memory, the rest 1 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 2 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 2, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 3 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 3, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 4 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 4, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "desk, Chromium 1 of 10", set: rest, project: chromium-desk, browser: chromium, job: 1, jobs: 10 }
          - { name: "desk, Chromium 2 of 10", set: rest, project: chromium-desk, browser: chromium, job: 2, jobs: 10 }
          - { name: "desk, Chromium 3 of 10", set: rest, project: chromium-desk, browser: chromium, job: 3, jobs: 10 }
          - { name: "desk, Chromium 4 of 10", set: rest, project: chromium-desk, browser: chromium, job: 4, jobs: 10 }
          - { name: "desk, Chromium 5 of 10", set: rest, project: chromium-desk, browser: chromium, job: 5, jobs: 10 }
          - { name: "desk, Chromium 6 of 10", set: rest, project: chromium-desk, browser: chromium, job: 6, jobs: 10 }
          - { name: "desk, Chromium 7 of 10", set: rest, project: chromium-desk, browser: chromium, job: 7, jobs: 10 }
          - { name: "desk, Chromium 8 of 10", set: rest, project: chromium-desk, browser: chromium, job: 8, jobs: 10 }
          - { name: "desk, Chromium 9 of 10", set: rest, project: chromium-desk, browser: chromium, job: 9, jobs: 10 }
          - { name: "desk, Chromium 10 of 10", set: rest, project: chromium-desk, browser: chromium, job: 10, jobs: 10 }
          - { name: "phone, Chromium 1 of 6", set: all, project: chromium-phone, browser: chromium, job: 1, jobs: 6 }
          - { name: "phone, Chromium 2 of 6", set: all, project: chromium-phone, browser: chromium, job: 2, jobs: 6 }
          - { name: "phone, Chromium 3 of 6", set: all, project: chromium-phone, browser: chromium, job: 3, jobs: 6 }
          - { name: "phone, Chromium 4 of 6", set: all, project: chromium-phone, browser: chromium, job: 4, jobs: 6 }
          - { name: "phone, Chromium 5 of 6", set: all, project: chromium-phone, browser: chromium, job: 5, jobs: 6 }
          - { name: "phone, Chromium 6 of 6", set: all, project: chromium-phone, browser: chromium, job: 6, jobs: 6 }
          - { name: "phone, WebKit 1 of 5", set: all, project: webkit-phone, browser: webkit, job: 1, jobs: 5 }
          - { name: "phone, WebKit 2 of 5", set: all, project: webkit-phone, browser: webkit, job: 2, jobs: 5 }
          - { name: "phone, WebKit 3 of 5", set: all, project: webkit-phone, browser: webkit, job: 3, jobs: 5 }
          - { name: "phone, WebKit 4 of 5", set: all, project: webkit-phone, browser: webkit, job: 4, jobs: 5 }
          - { name: "phone, WebKit 5 of 5", set: all, project: webkit-phone, browser: webkit, job: 5, jobs: 5 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browsers, cached, and their system libraries, each bounded and tried twice (.github/actions/playwright).
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: .
      - name: The demo, played in ${{ matrix.name }}
        run: node scripts/ci-shard.mjs ${{ matrix.project }} ${{ matrix.job }} ${{ matrix.jobs }} ${{ matrix.only }}
        env:
          DEMO_SET: ${{ matrix.set }}
          FLEET_PART: ${{ matrix.part }}
      # What a failed test left (its trace, where it keeps one), so a failure on a runner can be read rather than run again.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
  usage:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
  package:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's, the docs' and the guides' examples, run against the built package
        run: pnpm test:readme
      - name: The documentation site's checks, every export documented and every example run
        run: pnpm docs:check
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
