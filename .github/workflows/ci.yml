name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The package and the site are built once, and every demo job plays the tests against that copy (building took a minute and a half in each of 28 jobs). The tests read both dist (the package, as a CDN would serve it) and site.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The site and the documentation site, as the demo's tests read them
        run: pnpm site && node scripts/docs-site.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: |
            site
            dist
          retention-days: 1
  # The demo's browser suite, split so every job ends in minutes, not an hour (one job took 1.3 to 2.4 hours). scripts/ci-shard.mjs fills the jobs with the tests longest first, by their measured seconds (scripts/demo-times.json), so each job takes about the same; every test is played by one job. The fleet walk is one test, split by ship (FLEET_PART).
  demo:
    name: demo (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "graphics memory, fleet walk 1 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "1/5" }
          - { name: "graphics memory, fleet walk 2 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "2/5" }
          - { name: "graphics memory, fleet walk 3 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "3/5" }
          - { name: "graphics memory, fleet walk 4 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "4/5" }
          - { name: "graphics memory, fleet walk 5 of 5", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, only: "--grep \"the fleet kit\"", part: "5/5" }
          - { name: "graphics memory, the rest 1 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 2 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 2, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 3 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 3, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 4 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 4, jobs: 4, only: "--grep-invert \"the fleet kit\"" }
          - { name: "desk, Chromium 1 of 10", set: rest, project: chromium-desk, browser: chromium, job: 1, jobs: 10 }
          - { name: "desk, Chromium 2 of 10", set: rest, project: chromium-desk, browser: chromium, job: 2, jobs: 10 }
          - { name: "desk, Chromium 3 of 10", set: rest, project: chromium-desk, browser: chromium, job: 3, jobs: 10 }
          - { name: "desk, Chromium 4 of 10", set: rest, project: chromium-desk, browser: chromium, job: 4, jobs: 10 }
          - { name: "desk, Chromium 5 of 10", set: rest, project: chromium-desk, browser: chromium, job: 5, jobs: 10 }
          - { name: "desk, Chromium 6 of 10", set: rest, project: chromium-desk, browser: chromium, job: 6, jobs: 10 }
          - { name: "desk, Chromium 7 of 10", set: rest, project: chromium-desk, browser: chromium, job: 7, jobs: 10 }
          - { name: "desk, Chromium 8 of 10", set: rest, project: chromium-desk, browser: chromium, job: 8, jobs: 10 }
          - { name: "desk, Chromium 9 of 10", set: rest, project: chromium-desk, browser: chromium, job: 9, jobs: 10 }
          - { name: "desk, Chromium 10 of 10", set: rest, project: chromium-desk, browser: chromium, job: 10, jobs: 10 }
          - { name: "phone, Chromium 1 of 6", set: all, project: chromium-phone, browser: chromium, job: 1, jobs: 6 }
          - { name: "phone, Chromium 2 of 6", set: all, project: chromium-phone, browser: chromium, job: 2, jobs: 6 }
          - { name: "phone, Chromium 3 of 6", set: all, project: chromium-phone, browser: chromium, job: 3, jobs: 6 }
          - { name: "phone, Chromium 4 of 6", set: all, project: chromium-phone, browser: chromium, job: 4, jobs: 6 }
          - { name: "phone, Chromium 5 of 6", set: all, project: chromium-phone, browser: chromium, job: 5, jobs: 6 }
          - { name: "phone, Chromium 6 of 6", set: all, project: chromium-phone, browser: chromium, job: 6, jobs: 6 }
          - { name: "phone, WebKit 1 of 5", set: all, project: webkit-phone, browser: webkit, job: 1, jobs: 5 }
          - { name: "phone, WebKit 2 of 5", set: all, project: webkit-phone, browser: webkit, job: 2, jobs: 5 }
          - { name: "phone, WebKit 3 of 5", set: all, project: webkit-phone, browser: webkit, job: 3, jobs: 5 }
          - { name: "phone, WebKit 4 of 5", set: all, project: webkit-phone, browser: webkit, job: 4, jobs: 5 }
          - { name: "phone, WebKit 5 of 5", set: all, project: webkit-phone, browser: webkit, job: 5, jobs: 5 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's package mirror is sometimes slow (a few minutes for a font), and can fail: a failed install is tried again, and the step is cut off at 25 minutes. Never cut one off sooner: the package manager it started goes on holding its lock, and the next try fails on that.
      - name: The browser
        timeout-minutes: 25
        run: for try in 1 2 3; do pnpm exec playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "try $try failed"; sleep 20; done; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: demo-site
          path: .
      - name: The demo, played in ${{ matrix.name }}
        run: node scripts/ci-shard.mjs ${{ matrix.project }} ${{ matrix.job }} ${{ matrix.jobs }} ${{ matrix.only }}
        env:
          DEMO_SET: ${{ matrix.set }}
          FLEET_PART: ${{ matrix.part }}
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's, the docs' and the guides' examples, run against the built package
        run: pnpm test:readme
      - name: The documentation site's checks, every export documented and every example run
        run: pnpm docs:check
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
