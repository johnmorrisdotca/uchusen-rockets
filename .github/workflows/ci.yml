name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The demo's browser suite, split so every job ends in minutes, not an hour (one job took 1.3 to 2.4 hours). Playwright's own shards are contiguous runs of tests, and a run of one kind (161 tests, one a model) landed in one job. So each job plays several small shards that are far apart in the suite: job J of N plays shards J, J+N, J+2N and so on of N times `per` (6, unless set), and every shard is played by one job. The fleet walk is one test, split by ship (FLEET_PART). Every test still runs once.
  demo:
    name: demo (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "graphics memory, fleet walk 1 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "1/6" }
          - { name: "graphics memory, fleet walk 2 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "2/6" }
          - { name: "graphics memory, fleet walk 3 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "3/6" }
          - { name: "graphics memory, fleet walk 4 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "4/6" }
          - { name: "graphics memory, fleet walk 5 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "5/6" }
          - { name: "graphics memory, fleet walk 6 of 6", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 1, per: 1, only: "--grep \"the fleet kit\"", part: "6/6" }
          - { name: "graphics memory, the rest 1 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 1, jobs: 4, per: 6, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 2 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 2, jobs: 4, per: 6, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 3 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 3, jobs: 4, per: 6, only: "--grep-invert \"the fleet kit\"" }
          - { name: "graphics memory, the rest 4 of 4", set: freeze, project: chromium-desk, browser: chromium, job: 4, jobs: 4, per: 6, only: "--grep-invert \"the fleet kit\"" }
          - { name: "desk, Chromium 1 of 8", set: rest, project: chromium-desk, browser: chromium, job: 1, jobs: 8, per: 6 }
          - { name: "desk, Chromium 2 of 8", set: rest, project: chromium-desk, browser: chromium, job: 2, jobs: 8, per: 6 }
          - { name: "desk, Chromium 3 of 8", set: rest, project: chromium-desk, browser: chromium, job: 3, jobs: 8, per: 6 }
          - { name: "desk, Chromium 4 of 8", set: rest, project: chromium-desk, browser: chromium, job: 4, jobs: 8, per: 6 }
          - { name: "desk, Chromium 5 of 8", set: rest, project: chromium-desk, browser: chromium, job: 5, jobs: 8, per: 6 }
          - { name: "desk, Chromium 6 of 8", set: rest, project: chromium-desk, browser: chromium, job: 6, jobs: 8, per: 6 }
          - { name: "desk, Chromium 7 of 8", set: rest, project: chromium-desk, browser: chromium, job: 7, jobs: 8, per: 6 }
          - { name: "desk, Chromium 8 of 8", set: rest, project: chromium-desk, browser: chromium, job: 8, jobs: 8, per: 6 }
          - { name: "phone, Chromium 1 of 5", set: all, project: chromium-phone, browser: chromium, job: 1, jobs: 5, per: 6 }
          - { name: "phone, Chromium 2 of 5", set: all, project: chromium-phone, browser: chromium, job: 2, jobs: 5, per: 6 }
          - { name: "phone, Chromium 3 of 5", set: all, project: chromium-phone, browser: chromium, job: 3, jobs: 5, per: 6 }
          - { name: "phone, Chromium 4 of 5", set: all, project: chromium-phone, browser: chromium, job: 4, jobs: 5, per: 6 }
          - { name: "phone, Chromium 5 of 5", set: all, project: chromium-phone, browser: chromium, job: 5, jobs: 5, per: 6 }
          - { name: "phone, WebKit 1 of 4", set: all, project: webkit-phone, browser: webkit, job: 1, jobs: 4, per: 6 }
          - { name: "phone, WebKit 2 of 4", set: all, project: webkit-phone, browser: webkit, job: 2, jobs: 4, per: 6 }
          - { name: "phone, WebKit 3 of 4", set: all, project: webkit-phone, browser: webkit, job: 3, jobs: 4, per: 6 }
          - { name: "phone, WebKit 4 of 4", set: all, project: webkit-phone, browser: webkit, job: 4, jobs: 4, per: 6 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's package mirror is sometimes slow (a few minutes for a font), and can fail: a failed install is tried again, and the step is cut off at 25 minutes. Never cut one off sooner: the package manager it started goes on holding its lock, and the next try fails on that.
      - name: The browser
        timeout-minutes: 25
        run: for try in 1 2 3; do pnpm exec playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "try $try failed"; sleep 20; done; exit 1
      - name: The site and the documentation site, as the demo's tests read them
        run: pnpm site && node scripts/docs-site.mjs build
      - name: The demo, played in ${{ matrix.name }}
        run: |
          status=0
          total=$(( ${{ matrix.jobs }} * ${{ matrix.per }} ))
          for shard in $(seq ${{ matrix.job }} ${{ matrix.jobs }} $total); do
            pnpm exec playwright test --project=${{ matrix.project }} --shard=$shard/$total ${{ matrix.only }} || status=1
          done
          exit $status
        env:
          DEMO_SET: ${{ matrix.set }}
          FLEET_PART: ${{ matrix.part }}
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's, the docs' and the guides' examples, run against the built package
        run: pnpm test:readme
      - name: The documentation site's checks, every export documented and every example run
        run: pnpm docs:check
