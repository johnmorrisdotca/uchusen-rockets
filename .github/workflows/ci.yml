name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # The demo's browser suite, split so every job ends in under an hour (one job took 1.3 to 2.4 hours): the graphics-memory file in two jobs (the fleet walk, which is 17 minutes on a quick runner and 30 on a slow one, and the rest of the file), every other file at a desk's width, then a phone's width in Chromium, then in WebKit. Every test still runs once.
  demo:
    name: demo (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "graphics memory, fleet walk", set: freeze, project: chromium-desk, shard: "1/1", browser: chromium, only: "--grep \"the fleet kit\"" }
          - { name: "graphics memory, the rest", set: freeze, project: chromium-desk, shard: "1/1", browser: chromium, only: "--grep-invert \"the fleet kit\"" }
          - { name: "desk, Chromium", set: rest, project: chromium-desk, shard: "1/1", browser: chromium }
          - { name: "phone, Chromium", set: all, project: chromium-phone, shard: "1/1", browser: chromium }
          - { name: "phone, WebKit", set: all, project: webkit-phone, shard: "1/1", browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner's package mirror is sometimes slow (a few minutes for a font), and can fail: a failed install is tried again, and the step is cut off at 25 minutes. Never cut one off sooner: the package manager it started goes on holding its lock, and the next try fails on that.
      - name: The browser
        timeout-minutes: 25
        run: for try in 1 2 3; do pnpm exec playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "try $try failed"; sleep 20; done; exit 1
      - name: The site and the documentation site, as the demo's tests read them
        run: pnpm site && node scripts/docs-site.mjs build
      - name: The demo, played in ${{ matrix.name }}
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} ${{ matrix.only }}
        env:
          DEMO_SET: ${{ matrix.set }}
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Every way to use it (a script tag, Vite, webpack, React, Vue, Svelte, Angular, an iframe, TypeScript, Node), from the package as npm packs it
        run: pnpm test:usage
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports, by ESM and by require
        run: pnpm test:package
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's, the docs' and the guides' examples, run against the built package
        run: pnpm test:readme
      - name: The documentation site's checks, every export documented and every example run
        run: pnpm docs:check
