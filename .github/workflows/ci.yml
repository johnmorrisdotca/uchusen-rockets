name: CI
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - run: pnpm site
      - run: pnpm exec playwright test e2e/gestures.demo.ts --grep "fleet comparison" --project=chromium-desk --reporter=list
