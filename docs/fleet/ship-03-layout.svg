<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="755" viewBox="0 0 1160 755" role="img" aria-labelledby="title desc">
  <title id="title">ICV-03 Waymark — design stations</title>
  <desc id="desc">Original design-review drawing. A straight narrow spine connects two offset hangar shoulders, a blunt armoured bow and a tail with twin recessed drive nozzles. A separate schematic shows fuel, medical and command spaces.</desc>
  <defs>
    <style>
      .bg{fill:#111f2a}.card{fill:#172a37;stroke:#36505d}.hull{fill:#e4e8dc;stroke:#91a6a9;stroke-width:1.1}.frame{fill:#3c5560;stroke:#77939c;stroke-width:1.1}.hot{fill:#d7885a;stroke:#f2b792;stroke-width:1}.service{fill:#d9b55d;stroke:#f0d68f;stroke-width:1}.fuel{fill:#40636e;stroke:#81b6be;stroke-width:1}.line{fill:none;stroke:#7b9da9;stroke-width:1}.axis{fill:none;stroke:#557480;stroke-width:1;stroke-dasharray:5 5}.dark{fill:#132633;stroke:#8aabae;stroke-width:1}.title{font:700 34px system-ui,sans-serif;fill:#f4f0de}.sub{font:14px system-ui,sans-serif;fill:#b7c9cc}.label{font:700 13px system-ui,sans-serif;fill:#f1df9f;letter-spacing:1.7px}.small{font:12px system-ui,sans-serif;fill:#c6d5d5}.micro{font:11px system-ui,sans-serif;fill:#c6d5d5}
    </style>
    <g id="tail"><path class="frame" d="M0-28H27L58-18V18L27 28H0Z"/><path class="hot" d="M1-24H12V24H1Z"/></g>
